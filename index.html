<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="読んだ本を記録して、読書のペースを見える化するアプリ" />
    <title>Booknote｜読書記録</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="bg-gradient-to-br from-indigo-950 via-indigo-900 to-violet-800 text-white">
      <div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 sm:py-12">
        <div class="flex flex-col gap-8 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="mb-3 text-sm font-bold uppercase tracking-[0.28em] text-indigo-200">Booknote</p>
            <h1 class="text-3xl font-black tracking-tight sm:text-5xl">読書の記録を、<br class="sm:hidden" />次の一冊につなげる。</h1>
            <p class="mt-4 max-w-xl text-sm leading-7 text-indigo-100 sm:text-base">読んだ本と、これから読みたい本を一つの場所に。感想を残しながら、読書の積み重ねを楽しもう。</p>
          </div>
          <div class="rounded-2xl border border-white/20 bg-white/10 px-5 py-4 backdrop-blur-sm">
            <p class="text-xs font-bold text-indigo-200">今日の読書メモ</p>
            <p class="mt-2 text-sm leading-6 text-white">本のタイトルと感想を<br />気軽に残してみよう。</p>
          </div>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-5 py-8 sm:px-8 sm:py-12">
      <section aria-label="読書状況" class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200"><p class="text-sm font-bold text-slate-500">登録した本</p><p id="total-count" class="mt-2 text-3xl font-black text-indigo-900">0</p></div>
        <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200"><p class="text-sm font-bold text-slate-500">読書中</p><p id="reading-count" class="mt-2 text-3xl font-black text-amber-600">0</p></div>
        <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200"><p class="text-sm font-bold text-slate-500">読了</p><p id="finished-count" class="mt-2 text-3xl font-black text-emerald-600">0</p></div>
      </section>
      <section class="mt-8 grid gap-8 lg:grid-cols-[minmax(280px,360px)_1fr] lg:items-start">
        <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
          <div class="mb-6"><p class="text-sm font-bold text-indigo-600">NEW ENTRY</p><h2 class="mt-1 text-2xl font-black text-slate-900">本を記録する</h2><p class="mt-2 text-sm leading-6 text-slate-500">読み終わっていなくても大丈夫。今の気持ちを残そう。</p></div>
          <form id="book-form" class="space-y-4">
            <div><label for="title" class="mb-2 block text-sm font-bold text-slate-700">タイトル <span class="text-rose-500">*</span></label><input id="title" name="title" type="text" required placeholder="例：星の王子さま" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100" /></div>
            <div><label for="author" class="mb-2 block text-sm font-bold text-slate-700">著者 <span class="text-rose-500">*</span></label><input id="author" name="author" type="text" required placeholder="例：サン=テグジュペリ" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100" /></div>
            <div class="grid grid-cols-2 gap-3"><div><label for="status" class="mb-2 block text-sm font-bold text-slate-700">読書状況</label><select id="status" name="status" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"><option value="reading">読書中</option><option value="finished">読了</option></select></div><div><label for="rating" class="mb-2 block text-sm font-bold text-slate-700">評価</label><select id="rating" name="rating" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"><option value="0">未評価</option><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div></div>
            <div><label for="review" class="mb-2 block text-sm font-bold text-slate-700">ひとこと感想</label><textarea id="review" name="review" rows="4" placeholder="心に残ったことをメモしよう" class="w-full resize-none rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"></textarea></div>
            <p id="form-message" class="min-h-5 text-sm font-bold text-rose-500" aria-live="polite"></p>
            <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-black text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200">読書記録を追加する</button>
          </form>
        </div>
        <div class="min-w-0"><div class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-sm font-bold text-indigo-600">MY LIBRARY</p><h2 class="mt-1 text-2xl font-black text-slate-900">読書記録一覧</h2></div><div class="flex rounded-xl bg-white p-1 shadow-sm ring-1 ring-slate-200" aria-label="表示する読書状況"><button type="button" data-filter="all" class="filter-button rounded-lg px-3 py-2 text-xs font-bold transition">すべて</button><button type="button" data-filter="reading" class="filter-button rounded-lg px-3 py-2 text-xs font-bold transition">読書中</button><button type="button" data-filter="finished" class="filter-button rounded-lg px-3 py-2 text-xs font-bold transition">読了</button></div></div><div id="book-list" class="space-y-4"></div></div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-white px-5 py-8 text-center text-xs leading-6 text-slate-400 sm:px-8"><p>Booknote · 読書の記録は、このブラウザに保存されます。</p></footer>
    <script>
      const storageKey = "booknote-reading-log";
      let books = JSON.parse(localStorage.getItem(storageKey) || "[]");
      let currentFilter = "all";
      const form = document.querySelector("#book-form");
      const titleInput = document.querySelector("#title");
      const authorInput = document.querySelector("#author");
      const statusInput = document.querySelector("#status");
      const ratingInput = document.querySelector("#rating");
      const reviewInput = document.querySelector("#review");
      const formMessage = document.querySelector("#form-message");
      const bookList = document.querySelector("#book-list");
      const filterButtons = document.querySelectorAll(".filter-button");
      function saveBooks() { localStorage.setItem(storageKey, JSON.stringify(books)); }
      function getStatusLabel(status) { if (status === "finished") { return "読了"; } return "読書中"; }
      function createStars(rating) { if (rating === 0) { return "未評価"; } return "★".repeat(rating) + "☆".repeat(5 - rating); }
      function createBookCard(book) {
        const card = document.createElement("article"); card.className = "rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 transition hover:-translate-y-0.5 hover:shadow-md sm:p-6";
        const topRow = document.createElement("div"); topRow.className = "flex items-start justify-between gap-4";
        const titleArea = document.createElement("div"); titleArea.className = "min-w-0";
        const title = document.createElement("h3"); title.className = "break-words text-lg font-black text-slate-900"; title.textContent = book.title;
        const author = document.createElement("p"); author.className = "mt-1 text-sm text-slate-500"; author.textContent = book.author;
        const status = document.createElement("span"); status.className = book.status === "finished" ? "shrink-0 rounded-full bg-emerald-100 px-3 py-1 text-xs font-black text-emerald-700" : "shrink-0 rounded-full bg-amber-100 px-3 py-1 text-xs font-black text-amber-700"; status.textContent = getStatusLabel(book.status);
        titleArea.appendChild(title); titleArea.appendChild(author); topRow.appendChild(titleArea); topRow.appendChild(status); card.appendChild(topRow);
        const divider = document.createElement("div"); divider.className = "my-4 h-px bg-slate-100"; card.appendChild(divider);
        const detailRow = document.createElement("div"); detailRow.className = "flex flex-wrap items-center justify-between gap-3";
        const rating = document.createElement("p"); rating.className = "text-sm font-bold tracking-wider text-amber-500"; rating.textContent = createStars(book.rating);
        const actions = document.createElement("div"); actions.className = "flex flex-wrap gap-2";
        const toggleButton = document.createElement("button"); toggleButton.type = "button"; toggleButton.className = "rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold text-slate-600 transition hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-700"; toggleButton.textContent = book.status === "finished" ? "読書中に戻す" : "読了にする";
        toggleButton.addEventListener("click", function () { books = books.map(function (item) { if (item.id === book.id) { return { ...item, status: item.status === "finished" ? "reading" : "finished" }; } return item; }); saveBooks(); render(); });
        const deleteButton = document.createElement("button"); deleteButton.type = "button"; deleteButton.className = "rounded-lg border border-rose-100 px-3 py-2 text-xs font-bold text-rose-500 transition hover:bg-rose-50"; deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", function () { books = books.filter(function (item) { return item.id !== book.id; }); saveBooks(); render(); });
        actions.appendChild(toggleButton); actions.appendChild(deleteButton); detailRow.appendChild(rating); detailRow.appendChild(actions); card.appendChild(detailRow);
        if (book.review) { const review = document.createElement("p"); review.className = "mt-4 rounded-xl bg-slate-50 px-4 py-3 text-sm leading-6 text-slate-600"; review.textContent = book.review; card.appendChild(review); }
        return card;
      }
      function render() {
        const visibleBooks = currentFilter === "all" ? books : books.filter(function (book) { return book.status === currentFilter; });
        document.querySelector("#total-count").textContent = books.length;
        document.querySelector("#reading-count").textContent = books.filter(function (book) { return book.status === "reading"; }).length;
        document.querySelector("#finished-count").textContent = books.filter(function (book) { return book.status === "finished"; }).length;
        bookList.textContent = "";
        if (visibleBooks.length === 0) { const emptyState = document.createElement("div"); emptyState.className = "rounded-2xl border-2 border-dashed border-slate-200 bg-white px-6 py-14 text-center"; const icon = document.createElement("p"); icon.className = "text-4xl"; icon.textContent = currentFilter === "all" ? "📚" : "🔎"; const message = document.createElement("p"); message.className = "mt-4 font-bold text-slate-600"; message.textContent = currentFilter === "all" ? "最初の一冊を記録してみよう" : "この条件の本はまだありません"; const subMessage = document.createElement("p"); subMessage.className = "mt-2 text-sm text-slate-400"; subMessage.textContent = currentFilter === "all" ? "左のフォームから本を追加できます" : "別の表示に切り替えてみてください"; emptyState.appendChild(icon); emptyState.appendChild(message); emptyState.appendChild(subMessage); bookList.appendChild(emptyState); } else { visibleBooks.forEach(function (book) { bookList.appendChild(createBookCard(book)); }); }
        filterButtons.forEach(function (button) { const isActive = button.dataset.filter === currentFilter; button.classList.toggle("bg-indigo-600", isActive); button.classList.toggle("text-white", isActive); button.classList.toggle("text-slate-500", !isActive); button.classList.toggle("hover:bg-slate-100", !isActive); });
      }
      form.addEventListener("submit", function (event) { event.preventDefault(); const title = titleInput.value.trim(); const author = authorInput.value.trim(); if (!title || !author) { formMessage.classList.remove("text-emerald-600"); formMessage.classList.add("text-rose-500"); formMessage.textContent = "タイトルと著者を入力してください。"; return; } const newBook = { id: Date.now(), title: title, author: author, status: statusInput.value, rating: Number(ratingInput.value), review: reviewInput.value.trim() }; books = [newBook, ...books]; saveBooks(); form.reset(); formMessage.textContent = "読書記録を追加しました。"; formMessage.classList.remove("text-rose-500"); formMessage.classList.add("text-emerald-600"); render(); });
      filterButtons.forEach(function (button) { button.addEventListener("click", function () { currentFilter = button.dataset.filter; render(); }); });
      render();
    </script>
  </body>
</html>
